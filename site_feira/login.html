<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elas em rede | Login</title>
  <link rel="stylesheet" href="estilo_home_feira.css">
  <link rel="stylesheet" href="estilo_novo.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <section class="card login-card">
      <div class="welcome">
        <img src="logo.png" alt="Logo do Elas em Rede" class="logo">
        <h1>Seja bem-vindo(a)</h1>
        <p>Nosso projeto tem como objetivo de incentivar<br>o empreendedorismo feminino, criar ideias<br>inovadoras e muito mais !!!</p>
      </div>
      <div class="login-panel">
        <h2>Login</h2>
        <form action="home.html" method="post">
          <label for="email">Digite seu e-mail:</label>
          <input type="email" id="email" name="email" required>
          <label for="senha">Digite sua senha:</label>
          <input type="password" id="senha" name="senha" required>
          <button class="main-button" type="submit">ENTRAR</button>
          <p class="register-text">Se você é novo, <a href="cadastro.html">Cadastrar-se</a></p>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
