.botoes_de_cima {

    width: 100%;
    max-width: 4000px;

    border-radius: 17px;
    position: relative;

}

.botoes_de_cima button {

  .CaixaDePesquisa {
  display: flex;
  align-items: center;
  width: 100%;
  height: 40px;
  max-width: 1200px;
  background-color: #f1f3f5;
  border-radius: 50px;
  padding: 8px 16px;
  border: 2px solid transparent;
  transition: all 0.3s ease;
  position: relative;
  left: 50%;
  bottom: 1200px;
}

.CaixaDePesquisa:focus-within {
  background-color: #fff;
  border-color: #4c6ef5;
  box-shadow: 0 0 8px rgba(76, 110, 245, 0.2);
}

.TextoDePesquisa {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  font-size: 16px;
  color: #495057;
}

.TextoDePesquisa::placeholder {
  color: #adb5bd;
}

.Icon {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;

  align-items: center;

}
